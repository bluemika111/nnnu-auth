#===============================================================================
#  nnnu-auth.conf — 校园网自动认证配置
#  安装位置: /etc/nnnu-auth.conf     权限: chmod 600 (内含明文密码!)
#  改动后无需重启服务, 下一次检查即生效
#===============================================================================

#------------------------------ 必填 ------------------------------------------
USERNAME='填你的学号'          # 校园网账号 (学号)
PASSWORD='这里填你的密码'        # 校园网密码

#------------------------------ 探测与在线判定 ---------------------------------
# 未认证时这些地址会被网关劫持并 302 到门户; 认证成功后返回 204
PROBE_URLS='http://edge-http.microsoft.com/captiveportal/generate_204 http://www.gstatic.com/generate_204 http://connect.rom.miui.com/generate_204'
ONLINE_CODES='204'             # 视为"已在线"的 HTTP 状态码

#------------------------------ 兜底门户参数 -----------------------------------
# 正常情况下脚本从网关 302 里自动取这些值, 这里只是抓不到时的兜底
PORTAL_HOST='172.27.0.5'                     # 门户地址
WLANACNAME='ZAXSOFT-BRAS-WM'                 # 网关(BRAS)名
WLANACIP='172.27.0.100'                      # 网关(BRAS)地址
DEFAULT_URL='http://edge-http.microsoft.com/captiveportal/generate_204'
# WAN_IFACE='eth1'                           # 留空自动取默认路由接口
# WAN_MAC='aa:bb:cc:dd:ee:ff'                # 留空自动取接口 MAC (小写冒号分隔)
# WAN_IP='192.168.1.100'                       # 留空自动取接口 IPv4

#------------------------------ 表单开关 ---------------------------------------
BIND_MAC=1                     # 1 = 提交 isBindMac=bindmac (绑定MAC, 与浏览器默认勾选一致)
REMEMBER=1                     # 1 = 提交 remInfo=on (记住密码)

#------------------------------ 时间参数(秒) -----------------------------------
INTERVAL=60                    # monitor 模式的检测间隔
DIAL_WAIT=60                   # 等待"运营商网络拨号"结果的总时长
DIAL_INTERVAL=3                # 代拨结果轮询间隔
VERIFY_WAIT=60                 # 认证后等待真正联网的总时长
VERIFY_INTERVAL=3              # 连通性探测间隔
TIMEOUT=8                      # 单次 HTTP 超时
RETRY=2                        # 一次 ensure 内最多尝试几轮认证
LOCK_STALE=90                  # 互斥锁多久没刷新算陈旧(可被下一个实例抢占)

#------------------------------ 其他 -------------------------------------------
LOG_FILE='/var/log/nnnu-auth.log'
RESP_DUMP='/tmp/nnnu-auth-last-response.html'   # 认证失败时把门户返回页存这里, 便于排查
# HTTP_CLIENT='curl'           # 强制指定 auto|curl|uclient-fetch|wget
# HEXTOOL_OVERRIDE='awk'       # 强制 URL 编码器 od|hexdump|awk (默认自动探测, 留空即可)
# UA='Mozilla/5.0 ...'         # 自定义 User-Agent
